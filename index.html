<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Спаси Яйцо - Аркада</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #18222d;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        canvas {
            display: block;
            background: #0f1721;
            margin: 0 auto;
        }
        .modal {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 33, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .btn {
            background: #248bda;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.98); }
        .btn-withdraw { background: #28a745; }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            width: 150px;
            text-align: center;
            border-radius: 8px;
            border: 2px solid #248bda;
            outline: none;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <!-- Экран окончания игры -->
    <div id="gameOverScreen" class="modal">
        <h1 style="font-size: 36px; margin: 0;">💀 ИГРА ОКОНЧЕНА</h1>
        <p style="font-size: 18px; color: #aaa;">Заработано за раунд:</p>
        <p style="font-size: 26px; color: #00d2ff; font-weight: bold;" id="roundScoreText">+0.000 мл</p>
        <p style="font-size: 18px; color: #fff;">Баланс в игре: <b id="totalBankText">0.000</b> мл</p>
        
        <div>
            <button class="btn" onclick="restartGame()">Заново 🔄</button>
            <button class="btn btn-withdraw" onclick="showWithdrawModal()">Забрать в бота 🎁</button>
        </div>
    </div>

    <!-- Модальное окно вывода -->
    <div id="withdrawModal" class="modal">
        <h2>🎁 Перевод миллилитров</h2>
        <p style="color: #aaa; font-size: 14px; max-width: 80%;">
            Доступно: <b id="withdrawBalanceText" style="color: #00d2ff;">0</b> мл<br>
            • Мин: <b>1 мл</b> | Макс: <b>50 мл</b><br>
            • Целые числа (1, 5, 10 и т.д.)
        </p>
        <input type="number" id="withdrawAmount" placeholder="Например: 5" min="1" max="50" step="1">
        <div id="withdrawError" style="color: #ff4d4d; font-size: 14px; display: none; margin-bottom: 5px;"></div>
        
        <div>
            <button class="btn btn-withdraw" onclick="processWithdraw()">Начислить в бота ✅</button>
            <button class="btn" onclick="closeWithdrawModal()">Назад</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Получаем user_id из ссылки (если перешли по ?user_id=123)
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get("user_id") || "0";

        let totalBank = parseFloat(localStorage.getItem("egg_total_ml_" + userId) || "0.0");
        let mlEarned = 0.0;
        let gameOver = false;
        let hasShield = false;

        const player = { x: canvas.width / 2, y: canvas.height - 70, radius: 25 };
        let items = [];
        let spawnTimer = 0;

        function handleMove(e) {
            if (gameOver) return;
            const touchX = e.touches ? e.touches[0].clientX : e.clientX;
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, touchX));
        }

        window.addEventListener("mousemove", handleMove);
        window.addEventListener("touchmove", handleMove);

        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const speedMultiplier = 1 + Math.floor(mlEarned / 5) * 0.25;

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "left";
            ctx.fillText("За раунд: " + mlEarned.toFixed(3) + " мл", 15, 30);
            ctx.fillText("В игре: " + totalBank.toFixed(3) + " мл 💦", 15, 55);

            if (hasShield) {
                ctx.fillStyle = "#00d2ff";
                ctx.fillText("🛡 Щит активен!", 15, 80);
            }

            ctx.font = "40px Arial";
            ctx.textAlign = "center";
            ctx.fillText("🥚", player.x, player.y + 15);

            if (hasShield) {
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 12, 0, Math.PI * 2);
                ctx.strokeStyle = "#00d2ff";
                ctx.lineWidth = 4;
                ctx.stroke();
            }

            spawnTimer++;
            if (spawnTimer % Math.max(10, Math.floor(22 / speedMultiplier)) === 0) {
                const rand = Math.random();
                let type = "sword";
                if (mlEarned >= 7.0) {
                    if (rand < 0.20) type = "bomb";
                    else if (rand > 0.93 && !hasShield) type = "shield";
                }

                items.push({
                    x: Math.random() * (canvas.width - 60) + 30,
                    y: -30,
                    speed: (4 + Math.random() * 3) * speedMultiplier,
                    type: type
                });
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;

                ctx.font = "35px Arial";
                if (item.type === "sword") ctx.fillText("🗡", item.x, item.y);
                else if (item.type === "bomb") ctx.fillText("💣", item.x, item.y);
                else if (item.type === "shield") ctx.fillText("🛡", item.x, item.y);

                const dist = Math.hypot(player.x - item.x, player.y - item.y);
                if (dist < player.radius + 15) {
                    if (item.type === "shield") {
                        hasShield = true;
                        items.splice(i, 1);
                        continue;
                    } else {
                        if (hasShield) {
                            hasShield = false;
                            items.splice(i, 1);
                            continue;
                        } else {
                            showGameOver();
                            return;
                        }
                    }
                }

                if (item.y > canvas.height + 40) {
                    if (item.type === "sword") {
                        mlEarned += 0.005;
                    }
                    items.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        function showGameOver() {
            gameOver = true;
            totalBank += mlEarned;
            localStorage.setItem("egg_total_ml_" + userId, totalBank.toFixed(3));

            document.getElementById("roundScoreText").innerText = "+" + mlEarned.toFixed(3) + " мл 💦";
            document.getElementById("totalBankText").innerText = totalBank.toFixed(3);
            document.getElementById("gameOverScreen").style.display = "flex";
        }

        function restartGame() {
            mlEarned = 0.0;
            items = [];
            spawnTimer = 0;
            gameOver = false;
            hasShield = false;
            document.getElementById("gameOverScreen").style.display = "none";
            requestAnimationFrame(gameLoop);
        }

        function showWithdrawModal() {
            document.getElementById("withdrawBalanceText").innerText = Math.floor(totalBank);
            document.getElementById("withdrawError").style.display = "none";
            document.getElementById("withdrawAmount").value = "";
            document.getElementById("withdrawModal").style.display = "flex";
        }

        function closeWithdrawModal() {
            document.getElementById("withdrawModal").style.display = "none";
        }

        function processWithdraw() {
            const amountInput = document.getElementById("withdrawAmount").value;
            const errorDiv = document.getElementById("withdrawError");
            const val = parseInt(amountInput, 10);

            if (isNaN(val) || val.toString() !== amountInput.trim()) {
                errorDiv.innerText = "❌ Введите целое число!";
                errorDiv.style.display = "block";
                return;
            }

            if (val < 1 || val > 50) {
                errorDiv.innerText = "❌ Сумма должна быть от 1 до 50 мл!";
                errorDiv.style.display = "block";
                return;
            }

            if (val > totalBank) {
                errorDiv.innerText = `❌ Недостаточно средств! Доступно: ${totalBank.toFixed(3)} мл`;
                errorDiv.style.display = "block";
                return;
            }

            if (userId === "0") {
                errorDiv.innerText = "❌ Ошибка: не указан user_id в ссылке!";
                errorDiv.style.display = "block";
                return;
            }

            // Списываем баланс в игре
            totalBank -= val;
            localStorage.setItem("egg_total_ml_" + userId, totalBank.toFixed(3));

            // Перенаправляем в Telegram-бот с командой автозачисления
            window.location.href = `https://t.me/твой_юзернейм_бота?start=claim_${userId}_${val}`;
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
