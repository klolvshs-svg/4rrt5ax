<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Спаси Яйцо</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #18222d;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
        background: #0f1721;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script>
      const tg = window.Telegram.WebApp;
      tg.expand();

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let mlEarned = 0.0;
      let gameOver = false;
      let hasShield = false;

      // Игрок (Яйцо)
      const player = {
        x: canvas.width / 2,
        y: canvas.height - 70,
        radius: 25,
      };

      // Падающие объекты
      const items = [];
      let spawnTimer = 0;

      // Управление касанием/мышью
      function handleMove(e) {
        const touchX = e.touches ? e.touches[0].clientX : e.clientX;
        player.x = Math.max(
          player.radius,
          Math.min(canvas.width - player.radius, touchX),
        );
      }

      window.addEventListener("mousemove", handleMove);
      window.addEventListener("touchmove", handleMove);

      function gameLoop() {
        if (gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Базовая скорость увеличивается каждые 5 мл
        const speedMultiplier = 1 + Math.floor(mlEarned / 5) * 0.25;

        // Отрисовка интерфейса
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "left";
        ctx.fillText("Накоплено: " + mlEarned.toFixed(2) + " мл 💦", 20, 40);

        if (hasShield) {
          ctx.fillStyle = "#00d2ff";
          ctx.fillText("🛡 Щит активен!", 20, 70);
        }

        // Отрисовка игрока (Яйцо + Щит)
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("🥚", player.x, player.y + 15);

        if (hasShield) {
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.radius + 12, 0, Math.PI * 2);
          ctx.strokeStyle = "#00d2ff";
          ctx.lineWidth = 4;
          ctx.stroke();
        }

        // Создание объектов
        spawnTimer++;
        if (spawnTimer % Math.max(12, Math.floor(25 / speedMultiplier)) === 0) {
          const rand = Math.random();
          let type = "sword"; // По умолчанию меч

          // После 7 мл появляются бомбы и щиты
          if (mlEarned >= 7.0) {
            if (rand < 0.2) {
              type = "bomb"; // 20% шанс на бомбу
            } else if (rand > 0.93 && !hasShield) {
              type = "shield"; // 7% шанс на щит
            }
          }

          items.push({
            x: Math.random() * (canvas.width - 60) + 30,
            y: -30,
            speed: (4 + Math.random() * 3) * speedMultiplier,
            type: type,
          });
        }

        // Обновление и отрисовка объектов
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          item.y += item.speed;

          // Отрисовка значка
          ctx.font = "35px Arial";
          if (item.type === "sword") ctx.fillText("🗡", item.x, item.y);
          else if (item.type === "bomb") ctx.fillText("💣", item.x, item.y);
          else if (item.type === "shield") ctx.fillText("🛡", item.x, item.y);

          // Столкновение с игроком
          const dist = Math.hypot(player.x - item.x, player.y - item.y);
          if (dist < player.radius + 15) {
            if (item.type === "shield") {
              hasShield = true;
              items.splice(i, 1);
              continue;
            } else {
              // Меч или бомба
              if (hasShield) {
                hasShield = false; // Щит спасает 1 раз
                items.splice(i, 1);
                continue;
              } else {
                endGame();
                return;
              }
            }
          }

          // Объект упал на дно (успешный уворот)
          if (item.y > canvas.height + 40) {
            if (item.type === "sword") {
              mlEarned += 0.05; // +0.05 мл за каждый меч
            }
            items.splice(i, 1);
          }
        }

        requestAnimationFrame(gameLoop);
      }

      function endGame() {
        gameOver = true;
        const finalMl = parseFloat(mlEarned.toFixed(2));

        // Отправляем данные обратно
        try {
          tg.sendData(JSON.stringify({ score: finalMl }));
        } catch (e) {
          console.log(e);
        }

        setTimeout(() => {
          tg.close();
        }, 300);
      }

      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
