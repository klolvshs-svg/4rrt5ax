<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Спаси Яйцо</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #18222d;
        color: white;
        font-family: sans-serif;
        text-align: center;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        background: #0f1721;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <script>
      const tg = window.Telegram.WebApp;
      tg.expand(); // Разворачиваем во весь экран

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      let score = 0;
      let gameOver = false;

      // Игрок (Яйцо)
      const player = {
        x: canvas.width / 2,
        y: canvas.height - 60,
        radius: 25,
      };

      // Падающие ножи
      const knives = [];
      let spawnTimer = 0;

      // Управление касанием/мышью
      function handleMove(e) {
        const touchX = e.touches ? e.touches[0].clientX : e.clientX;
        player.x = Math.max(
          player.radius,
          Math.min(canvas.width - player.radius, touchX),
        );
      }

      window.addEventListener("mousemove", handleMove);
      window.addEventListener("touchmove", handleMove);

      function gameLoop() {
        if (gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Отрисовка счета
        score += 1;
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px Arial";
        ctx.fillText(
          "Заработано: " + Math.floor(score / 10) + " мл 💦",
          20,
          40,
        );

        // Отрисовка игрока (Яйцо)
        ctx.font = "40px Arial";
        ctx.textAlign = "center";
        ctx.fillText("🥚", player.x, player.y + 15);

        // Создание новых ножей
        spawnTimer++;
        if (spawnTimer % 20 === 0) {
          knives.push({
            x: Math.random() * (canvas.width - 40) + 20,
            y: -30,
            speed: 5 + Math.random() * 4,
          });
        }

        // Обновление и отрисовка ножей
        for (let i = knives.length - 1; i >= 0; i--) {
          const k = knives[i];
          k.y += k.speed;

          ctx.fillText("🗡", k.x, k.y);

          // Проверка столкновения
          const dist = Math.hypot(player.x - k.x, player.y - k.y);
          if (dist < player.radius + 15) {
            endGame();
            return;
          }

          if (k.y > canvas.height + 50) {
            knives.splice(i, 1);
          }
        }

        requestAnimationFrame(gameLoop);
      }

      function endGame() {
        gameOver = true;
        const finalMl = Math.floor(score / 10);

        // Отправляем заработанные миллилитры обратно в Telegram-бота
        tg.sendData(JSON.stringify({ score: finalMl }));
      }

      requestAnimationFrame(gameLoop);
    </script>
  </body>
</html>
